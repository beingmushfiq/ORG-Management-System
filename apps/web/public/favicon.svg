  <line x1="50" y1="53" x2="50" y2="61" stroke="url(#rsmGold)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="50" y1="66" x2="50" y2="74" stroke="url(#rsmGold)" stroke-width="2.5" stroke-linecap="round" />

